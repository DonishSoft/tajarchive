name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        configuration: [Debug, AppStore]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build
        run: |
          xcodebuild -project 7-Zip/7-Zip.xcodeproj -scheme 7-Zip \
            -configuration ${{ matrix.configuration }} \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
