name: Feature request / Предложение
description: Suggest an idea for TajArchive. / Предложите улучшение.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like? / Чего не хватает?
      description: Describe the problem it solves and how you imagine it working.
    validations:
      required: true
  - type: textarea
    id: windows
    attributes:
      label: How does 7-Zip for Windows (or another app) handle it? / Как это сделано в 7-Zip для Windows или другой программе?
